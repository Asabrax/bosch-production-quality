name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Synthetic tests and notebook structure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Run tests without competition data
        run: python -m pytest -q
      - name: Validate notebook format and code syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import nbformat

          for path in (Path('explore.ipynb'), Path('date_analysis.ipynb')):
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              for index, cell in enumerate(notebook.cells):
                  if cell.cell_type == 'code':
                      ast.parse(cell.source, filename=f'{path}:cell-{index}')
              print(f'Validated {path}; dataset execution is a separate local check.')
          PY
